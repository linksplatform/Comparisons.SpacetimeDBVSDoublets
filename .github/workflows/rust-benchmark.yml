name: Benchmarks

on:
  push:
    branches: [main, master]
    paths: ['rust/**', 'csharp/**', 'scripts/**', '.github/workflows/rust-benchmark.yml']
  pull_request:
    branches: [main, master]
    paths: ['rust/**', 'csharp/**', 'scripts/**', '.github/workflows/rust-benchmark.yml']
  workflow_dispatch:

concurrency:
  group: benchmarks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  toolchain: nightly-2026-09-16
  SPACETIMEDB_URI: http://localhost:3000
  SPACETIMEDB_DB: benchmark-links

jobs:
  test-rust:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.toolchain }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust -> target
            rust/spacetime-module -> target
      - name: Rust quality checks
        working-directory: rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
      - run: scripts/install-spacetimedb.sh
      - name: Build module
        working-directory: rust/spacetime-module
        run: cargo build --locked --release --target wasm32-unknown-unknown
      - run: scripts/start-spacetimedb.sh
      - name: All Rust tests, including backend equivalence
        working-directory: rust
        run: cargo test --locked -- --test-threads=1 --include-ignored
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rust-test-logs-${{ matrix.os }}
          path: ci-logs/

  test-csharp:
    name: C# tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.toolchain }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/spacetime-module -> target
      - run: dotnet restore csharp/SpacetimeDBVSDoublets.slnx --locked-mode
      - run: dotnet format csharp/SpacetimeDBVSDoublets.slnx --no-restore --verify-no-changes
      - run: dotnet build csharp/SpacetimeDBVSDoublets.slnx --no-restore --configuration Release --warnaserror
      - run: scripts/install-spacetimedb.sh
      - name: Build module
        working-directory: rust/spacetime-module
        run: cargo build --locked --release --target wasm32-unknown-unknown
      - name: Verify generated bindings
        run: |
          spacetime generate --lang csharp --yes \
            --bin-path rust/spacetime-module/target/wasm32-unknown-unknown/release/spacetime_module.wasm \
            --out-dir csharp/SpacetimeDBVSDoublets/ModuleBindings
          git diff --exit-code -- csharp/SpacetimeDBVSDoublets/ModuleBindings
      - run: scripts/start-spacetimedb.sh
      - name: All C# tests, including backend equivalence
        run: dotnet run --project csharp/SpacetimeDBVSDoublets.Tests --configuration Release --no-build -- -parallelMode none
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: csharp-test-logs
          path: ci-logs/

  results-pipeline:
    name: Results pipeline tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install matplotlib numpy
      - working-directory: rust
        run: python3 -m unittest test_out -v
      - run: node scripts/check-file-size.mjs

  benchmark:
    name: Benchmark (${{ matrix.language }}, ${{ matrix.backend }})
    runs-on: ubuntu-latest
    needs: [test-rust, test-csharp, results-pipeline]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        language: [rust, csharp]
        backend: [spacetimedb, doublets]
    env:
      BENCHMARK_LINK_COUNT: ${{ github.event_name == 'pull_request' && '10' || '1000' }}
      BACKGROUND_LINK_COUNT: ${{ github.event_name == 'pull_request' && '30' || '3000' }}
      BENCHMARK_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.toolchain }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust -> target
            rust/spacetime-module -> target
      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'csharp'
        with:
          dotnet-version: '10.0.x'
      - name: Prepare output
        run: mkdir -p results
      - if: matrix.backend == 'spacetimedb'
        run: scripts/install-spacetimedb.sh
      - name: Build module
        if: matrix.backend == 'spacetimedb'
        working-directory: rust/spacetime-module
        run: cargo build --locked --release --target wasm32-unknown-unknown
      - if: matrix.backend == 'spacetimedb'
        run: scripts/start-spacetimedb.sh
      - name: Record the measuring VM's provenance
        run: python3 scripts/benchmark-metadata.py ${{ matrix.language }} ${{ matrix.backend }} results/${{ matrix.language }}-${{ matrix.backend }}.json
      - name: Rust benchmark
        if: matrix.language == 'rust'
        working-directory: rust
        shell: bash
        run: |
          set -o pipefail
          rm -rf target/criterion
          options=(--sample-size 20 --nresamples 10000)
          if [[ '${{ github.event_name }}' == pull_request ]]; then
            options=(--sample-size 10 --warm-up-time 1 --measurement-time 2 --nresamples 1000)
          fi
          cargo bench --locked --bench bench -- --output-format bencher "${options[@]}" \
            > ../results/rust-${{ matrix.backend }}.txt 2> ../results/rust-${{ matrix.backend }}.log
      - name: C# benchmark
        if: matrix.language == 'csharp'
        shell: bash
        run: |
          dotnet restore csharp/SpacetimeDBVSDoublets/SpacetimeDBVSDoublets.csproj --locked-mode
          dotnet build csharp/SpacetimeDBVSDoublets/SpacetimeDBVSDoublets.csproj --no-restore -c Release --warnaserror
          options=()
          if [[ '${{ github.event_name }}' == pull_request ]]; then options=(--quick); fi
          dotnet run --project csharp/SpacetimeDBVSDoublets --no-build -c Release -- \
            --backend=${{ matrix.backend }} "${options[@]}" \
            > results/csharp-${{ matrix.backend }}.txt 2> results/csharp-${{ matrix.backend }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.language }}-${{ matrix.backend }}
          path: results/

  report:
    name: Publish benchmark report
    runs-on: ubuntu-latest
    needs: benchmark
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install matplotlib numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: collected
          merge-multiple: true
      - name: Combine both backends and render both languages
        shell: bash
        run: |
          for language in rust csharp; do
            cat collected/$language-spacetimedb.txt collected/$language-doublets.txt > $language/out.txt
            python3 rust/out.py $language/out.txt --language "$language" \
              --metadata collected/$language-spacetimedb.json collected/$language-doublets.json \
              --results "$language/results.md" --readme README.md --output-dir docs/benchmarks
            cat "$language/results.md" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Commit full results on the default branch
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        run: |
          git config user.email linksplatform@gmail.com
          git config user.name LinksPlatformBencher
          git add README.md docs/benchmarks rust/out.txt rust/results.md csharp/out.txt csharp/results.md
          if ! git diff --staged --quiet; then
            git commit -m "Update benchmark results [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-report
          path: |
            README.md
            docs/benchmarks/
            rust/results.md
            csharp/results.md
            collected/
